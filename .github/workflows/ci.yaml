name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.devenv }} on ${{ matrix.system }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        devenv: ["v2.2.2", "v2.3.1", "v2.4.0"]
        system: [x86_64-linux, aarch64-linux, aarch64-darwin]
        include:
          - system: x86_64-linux
            runner: ubuntu-26.04
          - system: aarch64-linux
            runner: ubuntu-26.04-arm
          - system: aarch64-darwin
            runner: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ github.token }}

      - name: Configure cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv-extras
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Install devenv
        run: nix profile install github:cachix/devenv/${{ matrix.devenv }}

      - name: Run flake checks
        run: nix flake check

      - name: Run devenv tests
        run: devenv test
