name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DEVENV_VERSION: v2.1.2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@9280e7aca88deada44c930f1e2c78e21c3ae3edd # v31.7.0
        with:
          github_access_token: ${{ github.token }}

      - name: Configure cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install github:cachix/devenv/${{ env.DEVENV_VERSION }}

      - name: Run flake checks
        run: nix flake check

      - name: Run devenv tests
        run: devenv test
